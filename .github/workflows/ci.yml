name: CI

# Dormant until this tree is pushed to a Git remote; mirrors the Makefile so
# the same checks run locally (`make ci`) and in CI. No third-party runtime
# dependencies are introduced.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: gofmt (must be clean)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt required on:"; echo "$out"; exit 1; fi

      - name: Test (race)
        run: go test -race ./...

      - name: CSP hygiene
        run: go test -run TestStaticAssetsAreCSPClean ./webui/

      - name: FP/FN golden + fuzz seed corpus
        run: |
          go test ./internal/modules/ -run TestGoldenFindings
          go test -run=Fuzz ./internal/core/ ./internal/modules/ ./internal/mcp/

      - name: Build binaries
        run: |
          go build -ldflags="-X main.version=${GITHUB_REF_NAME:-ci}" -o w1r3hound .
          go build -o webui/w1r3hound-webui ./webui

      - name: Smoke (loopback portscan)
        run: make smoke

      - name: MCP smoke (initialize handshake)
        run: make mcp-smoke

  vulncheck:
    runs-on: ubuntu-latest
    # Gate: fails the build on any known Go stdlib/module advisory. The toolchain
    # is pinned in go.mod to keep this deterministic (see docs/SECURITY_ASSESSMENT.md).
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  juiceshop:
    runs-on: ubuntu-latest
    # End-to-end against a real Juice Shop container (TEST_PLAN.md §4.2). Kept
    # off the default gate: it depends on Docker networking in the runner.
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Juice Shop end-to-end
        run: make e2e-juiceshop

  gosec:
    runs-on: ubuntu-latest
    # Gate: the tree is gosec-clean (accepted G-items carry inline #nosec
    # justifications). A new unannotated finding fails the build.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          "$(go env GOPATH)/bin/gosec" -quiet ./...
